services:
  # ── 1. Django Backend Web Service ─────────────────────────────────────────
  - type: web
    name: cse-erp-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate --noinput"
    startCommand: "gunicorn erp_backend.wsgi:application --chdir backend --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: cse-erp-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://cse-erp-frontend.onrender.com"

  # ── 2. Vite + React Frontend Web Service ─────────────────────────────────
  - type: web
    name: cse-erp-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://cse-erp-backend.onrender.com/api"

databases:
  # ── 3. Managed PostgreSQL Database ────────────────────────────────────────
  - name: cse-erp-postgres
    databaseName: cse_erp_db
    user: cse_admin
    plan: free
